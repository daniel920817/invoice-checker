<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>對帳比對工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    background: #f5f4f0; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem;
  }
  h1 { text-align: center; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
  .subtitle { text-align: center; font-size: 0.875rem; color: #666; margin-bottom: 2rem; }
  .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 860px; margin: 0 auto 1.5rem; }
  .drop-zone {
    background: #fff; border: 2px dashed #ccc; border-radius: 12px;
    padding: 1.75rem 1rem; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: #3a7bd5; background: #f0f5ff; }
  .drop-zone.loaded { border-color: #2d9a5c; border-style: solid; background: #f0faf4; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .drop-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; color: #888; margin-bottom: 0.4rem; }
  .drop-name { font-size: 0.875rem; color: #1a1a1a; font-weight: 600; }
  .drop-hint { font-size: 0.75rem; color: #aaa; margin-top: 0.25rem; }
  .btn-compare {
    background: #1a1a1a; color: #fff;
    border: none; border-radius: 8px; padding: 0.75rem 2.5rem;
    font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 0.05em;
    transition: background 0.15s; font-family: inherit;
  }
  .btn-compare:hover { background: #333; }
  .btn-compare:disabled { background: #ccc; cursor: not-allowed; }
  .summary-row {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 0.75rem; max-width: 860px; margin: 0 auto 1.5rem;
  }
  .stat-card { background: #fff; border-radius: 10px; padding: 1rem; text-align: center; border: 1px solid #e8e8e8; }
  .stat-num { font-size: 1.75rem; font-weight: 700; }
  .stat-lbl { font-size: 0.7rem; color: #888; margin-top: 0.2rem; letter-spacing: 0.04em; }
  .stat-card.red    .stat-num { color: #d03030; }
  .stat-card.purple .stat-num { color: #7c3abf; }
  .stat-card.orange .stat-num { color: #c07020; }
  .stat-card.blue   .stat-num { color: #3a7bd5; }
  .stat-card.green  .stat-num { color: #2d9a5c; }
  .filter-row { max-width: 860px; margin: 0 auto 0.75rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .filter-btn {
    padding: 0.35rem 0.85rem; border-radius: 20px; border: 1px solid #ddd;
    background: #fff; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .table-wrap { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th {
    background: #f5f4f0; padding: 0.7rem 0.75rem; text-align: left;
    font-weight: 700; font-size: 0.75rem; letter-spacing: 0.06em; color: #555;
    border-bottom: 1px solid #e0e0e0; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  td { padding: 0.55rem 0.75rem; vertical-align: middle; }
  .tag { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
  .tag-diff          { background: #ffeaea; color: #b02020; }
  .tag-ambiguous     { background: #f3e8ff; color: #6b21a8; }
  .tag-vendor-only   { background: #fff5e0; color: #905010; }
  .tag-internal-only { background: #e8f3ff; color: #1a5ca0; }
  .tag-ok            { background: #e8faf0; color: #1a7040; }
  .price-diff  { color: #d03030; font-weight: 700; }
  .price-ok    { color: #2d9a5c; }
  .price-na    { color: #bbb; }
  .diff-amt    { font-size: 0.75rem; color: #d03030; }
  .price-multi { font-size: 0.78rem; line-height: 1.7; }
  .no-data { text-align: center; padding: 3rem; color: #aaa; font-size: 0.875rem; }
  .btn-row { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
  .btn-export {
    background: #fff; color: #1a1a1a;
    border: 1.5px solid #1a1a1a; border-radius: 8px; padding: 0.75rem 2rem;
    font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 0.05em;
    transition: background 0.15s; font-family: inherit;
  }
  .btn-export:hover { background: #f5f4f0; }
  .btn-export:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
  @media (max-width: 650px) {
    .upload-row { grid-template-columns: 1fr; }
    .summary-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<h1>📋 對帳比對工具</h1>
<p class="subtitle">上傳廠商對帳單與公司內部收料單，自動找出價格差異</p>

<div class="upload-row">
  <div class="drop-zone" id="zone-vendor" ondragover="onDrag(event,'vendor')" ondragleave="offDrag('vendor')" ondrop="onDrop(event,'vendor')">
    <input type="file" accept=".xlsx,.xls" onchange="onFile(event,'vendor')">
    <div class="drop-icon" id="icon-vendor">📄</div>
    <div class="drop-label">廠商對帳單</div>
    <div class="drop-name" id="name-vendor">點擊或拖拉檔案至此</div>
    <div class="drop-hint">例：4月對帳單-鼎維.xlsx</div>
  </div>
  <div class="drop-zone" id="zone-internal" ondragover="onDrag(event,'internal')" ondragleave="offDrag('internal')" ondrop="onDrop(event,'internal')">
    <input type="file" accept=".xlsx,.xls" onchange="onFile(event,'internal')">
    <div class="drop-icon" id="icon-internal">📄</div>
    <div class="drop-label">公司內部收料單</div>
    <div class="drop-name" id="name-internal">點擊或拖拉檔案至此</div>
    <div class="drop-hint">例：202604.xlsx</div>
  </div>
</div>

<div class="btn-row">
  <button class="btn-compare" id="btn-compare" onclick="compare()" disabled>開始比對</button>
  <button class="btn-export" id="btn-export" onclick="exportExcel()" disabled>⬇ 匯出 Excel</button>
</div>

<div id="result-area" style="display:none">
  <div class="summary-row">
    <div class="stat-card red">   <div class="stat-num" id="s-diff">0</div>          <div class="stat-lbl">單價不符</div></div>
    <div class="stat-card purple"><div class="stat-num" id="s-ambiguous">0</div>     <div class="stat-lbl">廠商價格不一致</div></div>
    <div class="stat-card orange"><div class="stat-num" id="s-vendor-only">0</div>   <div class="stat-lbl">廠商有、公司無</div></div>
    <div class="stat-card blue">  <div class="stat-num" id="s-internal-only">0</div> <div class="stat-lbl">公司有、廠商無</div></div>
    <div class="stat-card green"> <div class="stat-num" id="s-ok">0</div>            <div class="stat-lbl">金額一致</div></div>
  </div>

  <div class="filter-row">
    <span style="font-size:0.8rem;color:#888;margin-right:0.25rem">篩選：</span>
    <button class="filter-btn" id="fb-all"           onclick="setFilter('all',this)">全部顯示</button>
    <button class="filter-btn" id="fb-diff"          onclick="setFilter('diff',this)">⚠ 單價不符</button>
    <button class="filter-btn" id="fb-ambiguous"     onclick="setFilter('ambiguous',this)">? 廠商價格不一致</button>
    <button class="filter-btn" id="fb-vendor-only"   onclick="setFilter('vendor-only',this)">廠商有、公司無</button>
    <button class="filter-btn" id="fb-internal-only" onclick="setFilter('internal-only',this)">公司有、廠商無</button>
    <button class="filter-btn" id="fb-ok"            onclick="setFilter('ok',this)">✓ 一致</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>狀態</th>
          <th>品號</th>
          <th>品名</th>
          <th style="text-align:right">廠商單價</th>
          <th style="text-align:right">公司單價</th>
          <th style="text-align:right">差額</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="no-data" id="no-data" style="display:none">此篩選條件無資料</div>
  </div>
</div>

<script>
let files = { vendor: null, internal: null };
let allRows = [];

function onDrag(e, s) { e.preventDefault(); document.getElementById('zone-'+s).classList.add('drag-over'); }
function offDrag(s) { document.getElementById('zone-'+s).classList.remove('drag-over'); }
function onDrop(e, s) { e.preventDefault(); offDrag(s); const f = e.dataTransfer.files[0]; if (f) loadFile(f, s); }
function onFile(e, s) { const f = e.target.files[0]; if (f) loadFile(f, s); }

function loadFile(f, side) {
  files[side] = f;
  document.getElementById('name-'+side).textContent = f.name;
  document.getElementById('icon-'+side).textContent = '✅';
  document.getElementById('zone-'+side).classList.add('loaded');
  if (files.vendor && files.internal) document.getElementById('btn-compare').disabled = false;
}

function readXlsx(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }));
    };
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });
}

// 廠商：D欄(3)=品號、E欄(4)=品名、H欄(7)=單價
function parseVendor(rows) {
  const hi = rows.findIndex(r => String(r[3]).includes('品號'));
  if (hi < 0) return {};
  const map = {};
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const partNo = String(r[3] || '').trim();
    if (!partNo || partNo.includes('空白') || partNo.includes('合計')) continue;
    const priceRaw = String(r[7] || '').trim();
    if (priceRaw === '不計價' || priceRaw === '') continue;
    const price = parseFloat(priceRaw);
    if (isNaN(price)) continue;
    if (!map[partNo]) map[partNo] = { name: String(r[4] || '').trim(), prices: [] };
    map[partNo].prices.push(price);
  }
  return map;
}

// 公司：G欄(6)=品號、H欄(7)=品名、K欄(10)=單價
function parseInternal(rows) {
  const hi = rows.findIndex(r => String(r[6]).includes('品號'));
  if (hi < 0) return {};
  const map = {};
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const partNo = String(r[6] || '').trim();
    if (!partNo) continue;
    const price = parseFloat(r[10]);
    if (isNaN(price)) continue;
    if (!map[partNo]) map[partNo] = { name: String(r[7] || '').trim(), prices: [] };
    map[partNo].prices.push(price);
  }
  return map;
}

// 去重：差距 < 1 元視為同一個價格
function uniquePrices(arr) {
  const out = [];
  for (const p of arr) {
    if (!out.some(x => Math.abs(x - p) < 1)) out.push(p);
  }
  return out.sort((a, b) => a - b);
}

async function compare() {
  const btn = document.getElementById('btn-compare');
  btn.disabled = true; btn.textContent = '比對中...';
  try {
    const [vData, iData] = await Promise.all([readXlsx(files.vendor), readXlsx(files.internal)]);
    const vMap = parseVendor(vData);
    const iMap = parseInternal(iData);
    const allParts = new Set([...Object.keys(vMap), ...Object.keys(iMap)]);

    allRows = [];
    for (const partNo of allParts) {
      const v  = vMap[partNo];
      const iv = iMap[partNo];
      const name = (v || iv).name;

      if (!v) {
        allRows.push({ partNo, name, status: 'internal-only', vPrices: [], iPrices: uniquePrices(iv.prices) });
        continue;
      }
      if (!iv) {
        allRows.push({ partNo, name, status: 'vendor-only', vPrices: uniquePrices(v.prices), iPrices: [] });
        continue;
      }

      const vPrices = uniquePrices(v.prices);
      const iPrices = uniquePrices(iv.prices);

      // 廠商自己就有多種不同單價 → 需人工確認
      if (vPrices.length > 1) {
        allRows.push({ partNo, name, status: 'ambiguous', vPrices, iPrices });
        continue;
      }

      // 廠商只有一個單價，看公司裡有沒有一樣的
      const vP = vPrices[0];
      const match = iPrices.some(p => Math.abs(p - vP) < 1);
      allRows.push({ partNo, name, status: match ? 'ok' : 'diff', vPrices, iPrices });
    }

    const order = { diff: 0, ambiguous: 1, 'vendor-only': 2, 'internal-only': 3, ok: 4 };
    allRows.sort((a, b) => order[a.status] - order[b.status]);

    const counts = {};
    for (const r of allRows) counts[r.status] = (counts[r.status] || 0) + 1;
    document.getElementById('s-diff').textContent          = counts.diff || 0;
    document.getElementById('s-ambiguous').textContent     = counts.ambiguous || 0;
    document.getElementById('s-vendor-only').textContent   = counts['vendor-only'] || 0;
    document.getElementById('s-internal-only').textContent = counts['internal-only'] || 0;
    document.getElementById('s-ok').textContent            = counts.ok || 0;

    document.getElementById('result-area').style.display = '';
    document.getElementById('btn-export').disabled = false;
    if (counts.diff > 0) setFilter('diff', document.getElementById('fb-diff'));
    else setFilter('all', document.getElementById('fb-all'));

  } catch(err) {
    alert('讀取失敗，請確認格式正確。\n' + err.message);
  }
  btn.disabled = false; btn.textContent = '開始比對';
}

function fmtPrices(prices, cls) {
  if (!prices || prices.length === 0) return '<span class="price-na">—</span>';
  return prices.map(p => `<span class="${cls}">${p.toLocaleString('zh-TW')}</span>`).join('<br>');
}

function renderTable(filter) {
  const filtered = filter === 'all' ? allRows : allRows.filter(r => r.status === filter);
  document.getElementById('no-data').style.display = filtered.length === 0 ? '' : 'none';

  const tagMap = {
    diff:            '<span class="tag tag-diff">⚠ 不符</span>',
    ambiguous:       '<span class="tag tag-ambiguous">? 廠商不一致</span>',
    'vendor-only':   '<span class="tag tag-vendor-only">廠商有</span>',
    'internal-only': '<span class="tag tag-internal-only">公司有</span>',
    ok:              '<span class="tag tag-ok">✓ 一致</span>',
  };

  document.getElementById('tbody').innerHTML = filtered.map(r => {
    let diffCell = '—';
    if (r.status === 'diff' && r.vPrices.length === 1 && r.iPrices.length >= 1) {
      const diff = r.iPrices[0] - r.vPrices[0];
      diffCell = `<span class="diff-amt">${diff > 0 ? '+' : ''}${diff.toLocaleString('zh-TW')}</span>`;
    }
    const vCls = r.status === 'diff' ? 'price-diff' : r.status === 'ok' ? 'price-ok' : 'price-na';
    const iCls = r.status === 'diff' ? 'price-diff' : r.status === 'ok' ? 'price-ok' : 'price-na';
    return `<tr>
      <td>${tagMap[r.status]}</td>
      <td style="font-family:monospace;font-size:0.78rem">${r.partNo}</td>
      <td>${r.name}</td>
      <td style="text-align:right" class="price-multi">${fmtPrices(r.vPrices, vCls)}</td>
      <td style="text-align:right" class="price-multi">${fmtPrices(r.iPrices, iCls)}</td>
      <td style="text-align:right">${diffCell}</td>
    </tr>`;
  }).join('');
}

function setFilter(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable(filter);
}

function exportExcel() {
  const statusLabel = { diff: '單價不符', ambiguous: '廠商價格不一致', 'vendor-only': '廠商有、公司無', 'internal-only': '公司有、廠商無', ok: '金額一致' };
  const data = [['狀態', '品號', '品名', '廠商單價', '公司單價', '差額']];
  for (const r of allRows) {
    const vP = r.vPrices.length ? r.vPrices.join(' / ') : '—';
    const iP = r.iPrices.length ? r.iPrices.join(' / ') : '—';
    let diff = '—';
    if (r.status === 'diff' && r.vPrices.length === 1 && r.iPrices.length >= 1) {
      diff = r.iPrices[0] - r.vPrices[0];
    }
    data.push([statusLabel[r.status], r.partNo, r.name, vP, iP, diff]);
  }
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{ wch: 14 }, { wch: 16 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 8 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '比對結果');
  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `對帳比對結果_${dateStr}.xlsx`);
}
</script>
</body>
</html>
